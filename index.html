<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Challenge: Famous font formats</title>
  <style>
    .declaration {
font-weight: bold 
    }

    .quote {
      font-style:italic;
    }

    h2 { 
      font-family: 'Courier New', Courier, monospace;
      font-size: 70px;
      font-weight : bold;
      text-transform: uppercase;

      color: transparent;
      background-image: url(https://tse3.mm.bing.net/th/id/OIP.d7YzE09z17fl0Mg98e34YwHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3);
      background-clip: text;
      background-colour: blue;
    }
  </style>
</head>

<body>

  <h2>Famous quotes</h2>
  <p class="quote">
    "My mama always said life was like a box of chocolates. You never know what you're gonna get.".
    <br> - Forrest Gump
  </p>

  <p class="quote">
    "May the force be with you."
    <br>- Star Wars
  </p>

  <h2>Famous declarations</h2>

  <p class="declaration">
    I'M BATMAN.
  </p>

  <p class="declaration">
    Earth, water, fire. Together, we are CAPTAIN PLANET!
  </p>

</body>

</html>
